# CI: lint → typecheck → unit → integration → build + güvenlik taramaları.
#
# Bu workflow `deploy.yml` tarafından da çağrılır (`workflow_call`): dağıtım
# hattı **aynı** kalite kapılarını yeniden tanımlamaz, bu dosyayı kullanır.
# İkinci bir kopya, zamanla birinden gevşeyen bir kapı demekti.
#
# Not: GitHub workflow'ları .github/workflows altında olmak zorundadır (platform kısıtı);
# infra/github-actions ise paylaşılan composite action ve yardımcı script'ler içindir.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Varsayılan token yetkisi en aza indirilir: CI yalnızca kodu okur.
permissions:
  contents: read

# `github.workflow` gruba dahildir: `deploy.yml` bu dosyayı `workflow_call` ile çağırdığında
# workflow adı çağıranınkidir ("Deploy"). Dahil edilmezse main'e her push'ta bağımsız CI ile
# Deploy içindeki CI aynı gruba düşer ve biri diğerini iptal eder.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  core-api:
    name: Core API (NestJS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: emek
          POSTGRES_PASSWORD: emek_ci
          POSTGRES_DB: emek
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U emek -d emek"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://emek:emek_ci@localhost:5432/emek
      # Integration testleri ayrı veritabanında çalışır ve şemasını sıfırlar.
      DATABASE_URL_TEST: postgres://emek:emek_ci@localhost:5432/emek_test
      REDIS_URL: redis://localhost:6379
      IDENTITY_PROVIDER: mock
      PAYMENT_PROVIDER: mock
      LOG_LEVEL: error

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Create test database
        env:
          PGPASSWORD: emek_ci
        run: psql -h localhost -U emek -d postgres -c 'CREATE DATABASE emek_test OWNER emek'

      - name: Migrations (up/down/up)
        working-directory: services/api
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
        run: |
          npx node-pg-migrate up
          npx node-pg-migrate down 0
          npx node-pg-migrate up

      - name: Integration tests
        working-directory: services/api
        # Katalog seed'i ve rota/sözleşme denetimleri test kurulumunun parçasıdır.
        run: npx jest --config jest.integration.config.js

      - name: Build
        run: npm run build

  ai-service:
    name: AI service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy app

      - name: Tests
        run: uv run pytest

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      # Yerel geliştirmeyle aynı sürüm (ADR-0025); sürüm kayması analiz/format farkı üretir.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze

      # Simülatör/gerçek API gerektiren integration_test burada koşmaz (bkz. R-106).
      - name: Tests
        run: flutter test

  # Faz 17 final E2E (R-106): Playwright kritik akışları gerçek core API + Postgres/PostGIS +
  # Redis + katalog seed'iyle. İki varyant: AI servisi kapalı (eşleştirme yedek yoldan,
  # bozulmuş mod sınanır) ve açık (`E2E_REQUIRE_AI=true`: tam zincir yedek yola düşerse
  # başarısız olur — açıklanabilirlik zinciri uçtan uca). Veritabanı iş başına sıfırdan
  # kurulduğu için `e2e-` önekli veri birikmez. Mobil `integration_test` emülatör ister;
  # burada koşmaz.
  e2e:
    name: E2E (Playwright, AI ${{ matrix.ai && 'açık' || 'kapalı' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ai: [false, true]

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: emek
          POSTGRES_PASSWORD: emek_ci
          POSTGRES_DB: emek
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U emek -d emek"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    # `.env.example` kopyalanır; buradaki değerler dotenv'in üzerine yazmadığı süreç
    # ortamıdır. Hepsi yerel/mock: seed yardımcısı yerel olmayan hedefi reddeder.
    env:
      NODE_ENV: development
      LOG_LEVEL: warn
      DATABASE_URL: postgres://emek:emek_ci@localhost:5432/emek
      REDIS_URL: redis://localhost:6379
      AUTH_PROVIDER: mock
      IDENTITY_PROVIDER: mock
      PAYMENT_PROVIDER: mock
      APP_CHECK_ENABLED: 'false'
      # AI kapalı varyantta kapalı bir porta işaret eder: eşleştirme yedek yola düşer.
      AI_SERVICE_URL: ${{ matrix.ai && 'http://localhost:8000' || 'http://localhost:8999' }}
      NEXT_PUBLIC_AUTH_MODE: mock
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_DATABASE_URL: postgres://emek:emek_ci@localhost:5432/emek
      E2E_REQUIRE_AI: ${{ matrix.ai }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: cp .env.example .env

      - name: Migrations + katalog seed
        run: |
          npm run migrate:up
          npm run seed:catalog --workspace=@emek/api

      - uses: astral-sh/setup-uv@v5
        if: matrix.ai
        with:
          enable-cache: true

      - name: AI servisini başlat
        if: matrix.ai
        working-directory: services/ai
        run: |
          uv sync --frozen
          nohup uv run uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/ai.log" 2>&1 &
          timeout 90 bash -c 'until curl -fs http://localhost:8000/api/v1/health/live; do sleep 2; done'

      - name: Core API'yi başlat
        working-directory: services/api
        run: |
          nohup npx dotenv -e ../../.env -- node --require ts-node/register src/main.ts \
            > "$RUNNER_TEMP/api.log" 2>&1 &
          timeout 120 bash -c 'until curl -fs http://localhost:3000/api/v1/health/live; do sleep 2; done'

      - name: Playwright tarayıcısı
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Web ve admin `next dev` ile Playwright yapılandırmasından başlatılır.
      - name: E2E
        run: npm run test:e2e

      - name: Rapor ve servis günlükleri
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.ai && 'ai' || 'fallback' }}
          path: |
            e2e/playwright-report
            e2e/test-results
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/ai.log
          retention-days: 7

  containers:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build core API image
        run: docker build -f infra/docker/Dockerfile.api -t emek-api:ci .

      - name: Build AI service image
        run: docker build -f infra/docker/Dockerfile.ai -t emek-ai:ci .

      # Ön uç imajları (R-105): yalnız derlenebilirlik. Gerçek NEXT_PUBLIC_* değerleri ortama
      # özeldir ve dağıtım hattında verilir; burada gizli olmayan yer tutucular yeter.
      - name: Build web + admin images
        run: |
          for app in web admin; do
            docker build -f infra/docker/Dockerfile.frontend --build-arg APP="$app" \
              --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=ci \
              --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=ci.firebaseapp.com \
              --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=ci \
              --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=1:1:web:ci \
              -t "emek-$app:ci" .
          done

  security:
    name: Güvenlik taraması (dependency + SAST)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Bağımlılık taraması **bloklayıcıdır** (Faz 12 exit kriteri): high/critical bir
      # açık, gerekçeli bir istisna olmadan main'e giremez. İstisna mekanizması
      # `overrides` + ADR-0015'teki gerekçedir; gerekçesiz bir override CI'ı geçmez
      # çünkü override kaldırıldığında audit yine düşer.
      - name: Dependency audit (npm)
        run: npm audit --audit-level=high

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install semgrep
        run: pip install semgrep==1.177.0

      # `--error` bulguyu sıfır olmayan çıkış koduna çevirir: tarama raporlayıcı
      # değil, kapıdır. Gerekçeli istisnalar kodda `nosemgrep` ile işaretlenir ve
      # code review'da görünür olur.
      - name: SAST (semgrep — kayıt defteri paketleri)
        run: >-
          semgrep --error --metrics=off
          --config p/typescript --config p/security-audit --config p/secrets
          --exclude node_modules --exclude dist .

      # Emek'e özgü kurallar: mimari kararların ihlalleri (R-53 proxy güveni,
      # audit append-only, SQL tanımlayıcı enterpolasyonu).
      - name: SAST (semgrep — Emek kuralları)
        run: semgrep --error --metrics=off --config .semgrep.yml .

      # AI servisinin bağımlılıkları da bloklayıcıdır. `--no-emit-project` yerel
      # paketi dışarıda bırakır: `emek-ai` PyPI'da yoktur ve `--strict` onu
      # "denetlenemedi" diye hata sayardı.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python dependency audit (pip-audit)
        working-directory: services/ai
        run: |
          uv export --no-hashes --no-emit-project --all-groups -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --strict
