# CI: lint → typecheck → unit → integration → build + güvenlik taramaları.
#
# Bu workflow `deploy.yml` tarafından da çağrılır (`workflow_call`): dağıtım
# hattı **aynı** kalite kapılarını yeniden tanımlamaz, bu dosyayı kullanır.
# İkinci bir kopya, zamanla birinden gevşeyen bir kapı demekti.
#
# Not: GitHub workflow'ları .github/workflows altında olmak zorundadır (platform kısıtı);
# infra/github-actions ise paylaşılan composite action ve yardımcı script'ler içindir.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Varsayılan token yetkisi en aza indirilir: CI yalnızca kodu okur.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  core-api:
    name: Core API (NestJS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: emek
          POSTGRES_PASSWORD: emek_ci
          POSTGRES_DB: emek
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U emek -d emek"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://emek:emek_ci@localhost:5432/emek
      # Integration testleri ayrı veritabanında çalışır ve şemasını sıfırlar.
      DATABASE_URL_TEST: postgres://emek:emek_ci@localhost:5432/emek_test
      REDIS_URL: redis://localhost:6379
      IDENTITY_PROVIDER: mock
      PAYMENT_PROVIDER: mock
      LOG_LEVEL: error

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Create test database
        env:
          PGPASSWORD: emek_ci
        run: psql -h localhost -U emek -d postgres -c 'CREATE DATABASE emek_test OWNER emek'

      - name: Migrations (up/down/up)
        working-directory: services/api
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
        run: |
          npx node-pg-migrate up
          npx node-pg-migrate down 0
          npx node-pg-migrate up

      - name: Integration tests
        working-directory: services/api
        # Katalog seed'i ve rota/sözleşme denetimleri test kurulumunun parçasıdır.
        run: npx jest --config jest.integration.config.js

      - name: Build
        run: npm run build

  ai-service:
    name: AI service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy app

      - name: Tests
        run: uv run pytest

  containers:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build core API image
        run: docker build -f infra/docker/Dockerfile.api -t emek-api:ci .

      - name: Build AI service image
        run: docker build -f infra/docker/Dockerfile.ai -t emek-ai:ci .

  security:
    name: Güvenlik taraması (dependency + SAST)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Bağımlılık taraması **bloklayıcıdır** (Faz 12 exit kriteri): high/critical bir
      # açık, gerekçeli bir istisna olmadan main'e giremez. İstisna mekanizması
      # `overrides` + ADR-0015'teki gerekçedir; gerekçesiz bir override CI'ı geçmez
      # çünkü override kaldırıldığında audit yine düşer.
      - name: Dependency audit (npm)
        run: npm audit --audit-level=high

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install semgrep
        run: pip install semgrep==1.177.0

      # `--error` bulguyu sıfır olmayan çıkış koduna çevirir: tarama raporlayıcı
      # değil, kapıdır. Gerekçeli istisnalar kodda `nosemgrep` ile işaretlenir ve
      # code review'da görünür olur.
      - name: SAST (semgrep — kayıt defteri paketleri)
        run: >-
          semgrep --error --metrics=off
          --config p/typescript --config p/security-audit --config p/secrets
          --exclude node_modules --exclude dist .

      # Emek'e özgü kurallar: mimari kararların ihlalleri (R-53 proxy güveni,
      # audit append-only, SQL tanımlayıcı enterpolasyonu).
      - name: SAST (semgrep — Emek kuralları)
        run: semgrep --error --metrics=off --config .semgrep.yml .

      # AI servisinin bağımlılıkları da bloklayıcıdır. `--no-emit-project` yerel
      # paketi dışarıda bırakır: `emek-ai` PyPI'da yoktur ve `--strict` onu
      # "denetlenemedi" diye hata sayardı.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python dependency audit (pip-audit)
        working-directory: services/ai
        run: |
          uv export --no-hashes --no-emit-project --all-groups -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --strict
