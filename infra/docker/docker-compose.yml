# Yerel geliştirme altyapısı.
# Kullanım (repo kökünden): npm run infra:up / npm run infra:down / npm run infra:reset
#
# Uygulama servisleri (api, ai) bilinçli olarak burada değil: geliştirme sırasında
# host üzerinde watch modunda çalışmaları daha hızlı. Container imajları
# infra/docker/Dockerfile.* içindedir ve CI/Cloud Run tarafından kullanılır.

name: emek-local

services:
  postgres:
    # Cloud SQL PostgreSQL 16 ile aynı ana sürüm (varsayım A-06 Faz 13'te doğrulanacak).
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: emek
      POSTGRES_PASSWORD: emek_local_dev
      POSTGRES_DB: emek
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Integration testleri ayrı veritabanında çalışır (dev verisi silinmesin).
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U emek -d emek']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Pub/Sub emulator: event altyapısı Faz 2'de (outbox) devreye girer, ADR-0010.
  # Opsiyonel profile: imaj ~1.5GB ve Faz 1'de hiçbir kod Pub/Sub kullanmıyor.
  # Gerektiğinde: npm run infra:up:events
  pubsub:
    profiles: ['events', 'full']
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --project=emek-local
      - --host-port=0.0.0.0:8085
    ports:
      - '8085:8085'
    healthcheck:
      # Emulator kök dizinde 200 döner; curl yoksa python ile kontrol edilir.
      test:
        [
          'CMD-SHELL',
          'python3 -c "import urllib.request;urllib.request.urlopen(''http://localhost:8085'')"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
